name: Sonic & BTC – monitor i raport

on:
  schedule:
    - cron: '7 * * * *'   # zapas: GitHub uruchamia harmonogram nieregularnie; właściwe czuwanie to łańcuch długich uruchomień (patrz ostatni krok)
  workflow_dispatch:
    inputs:
      force_report:
        description: 'Wygeneruj raport HTML teraz (nawet jeśli dziś już był)'
        type: boolean
        default: true

concurrency:
  group: handel-bot
  cancel-in-progress: false

permissions:
  contents: write     # bot zapisuje kopię raportu i sygnałów w folderze raport/
  actions: write      # uruchomienie kolejnej zmiany czuwania (łańcuch)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'Sonic-buy-sell' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          LIVE_UNTIL_MINUTE: "59"   # po części godzinowej bot czuwa na żywo (co minutę) do :59
          RUN_MINUTES: "335"        # tryb ciągły: cykl co godzinę przez ok. 5,5 h, potem kolejne uruchomienie
          REPO_PUSH: "1"            # po każdym cyklu wypchnij raport/
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_report && '1' || '0' }}
          PYTHONIOENCODING: "utf-8"
          LANG: "C.UTF-8"
          LC_ALL: "C.UTF-8"
        run: python bot.py

      - name: Zapisz raport i sygnały w repozytorium (folder raport/)
        if: always()
        run: |
          git config user.name "handel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raport/ || exit 0
          if git diff --cached --quiet; then echo "Brak zmian w raport/"; exit 0; fi
          git commit -q -m "Raport bota $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "Nie udało się wypchnąć raportu (spróbuje przy następnym uruchomieniu)"

      - name: Uruchom kolejną zmianę czuwania (łańcuch bez przerw)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run bot.yml --ref "${GITHUB_REF_NAME}" -f force_report=false || echo "Nie udało się uruchomić kolejnej zmiany – przejmie harmonogram"
